ple", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "How often do you exercise?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "What do you usually eat for breakfast?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "Why is it important to arrive on time?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "What do you do when you feel stressed?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "Describe a healthy habit you have tried to develop.", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Would you rather walk or take a bus for a short trip? Explain.", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Tell me about a time when your plans changed unexpectedly.", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "What are the advantages and disadvantages of shopping online?", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Some people believe schools should start later in the morning. What is your opinion?", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}], "scene": "Bus Stop", "prompts": ["Where are the people waiting?", "What might the people be doing while they wait?", "How do you usually travel around your city?", "Describe the scene in as much detail as you can."]}, {"name": "Mock Test 3", "passages": [{"title": "Shopping with Less Waste", "text": "Online shopping makes it easy to compare prices and order products from home. Yet every delivery may require boxes, plastic wrapping, and transportation. Some shoppers are now trying to reduce unnecessary waste. They may combine several purchases into one order or choose products with less packaging. Others repair old items instead of replacing them immediately. Businesses can help by offering reusable containers and clear information about materials. None of these choices will solve every environmental problem, but small changes by many people can reduce the amount of waste we produce."}, {"title": "A Weekend Without Screens", "text": "Last month, a family decided to spend one weekend without entertainment on phones or tablets. At first, everyone felt bored because they were used to checking messages and watching videos. On Saturday morning, they went for a walk and discovered a small park they had never visited. Later, they cooked dinner together and played a board game. By Sunday evening, they realized that they had talked more than usual. They did not decide to stop using technology completely. Instead, they agreed to set aside a few hours each week for activities that did not involve screens. The experience helped them find a healthier balance."}], "questions": [{"q": "What is your favorite way to spend a free afternoon?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "How do you keep in touch with friends?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "What makes a public place comfortable?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "Why do people take photos when they travel?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "What is one thing you would like to improve about your neighborhood?", "seconds": 15, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I usually... because...", "One important reason is...", "For example, ..."]}, {"q": "Describe a memorable meal you had with other people.", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Would you prefer to live near the sea or in the mountains? Why?", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Tell me about a time when you learned something from a mistake.", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "How can technology make everyday life easier for older people?", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}, {"q": "Some people think traveling teaches more than reading books. What do you think?", "seconds": 30, "ideas": ["Give a clear answer", "Add a reason or example", "Connect your ideas with because, for example, or also"], "stems": ["I remember a time when...", "First, ... Then, ...", "In my opinion, ... because..."]}], "scene": "Weekend Market", "prompts": ["What kind of place is shown in the picture?", "What are the people buying or selling?", "Do you enjoy visiting places like this? Why?", "Describe other activities and details in the picture."]}];
let state={set:0,mode:'practice',step:0,phase:'idle',remaining:0,recorded:[],showHelp:false,active:false};let interval=null,recorder=null,chunks=[],stream=null,recordURL=null,audioObj=null,speaking=false,token=0;
const app=document.getElementById('app');const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=()=>[{kind:'intro',label:'Introduction'},...SETS[state.set].passages.map((p,i)=>({kind:'read',i,label:'Part 1 · Passage '+(i+1)})),...SETS[state.set].questions.map((q,i)=>({kind:'question',i,label:'Part 2 · Question '+(i+1)})),{kind:'scene',label:'Part 3 · Picture Description'}];
function clearTimer(){if(interval)clearInterval(interval);interval=null}function stopSpeech(){token++;speaking=false;try{speechSynthesis.cancel()}catch(e){}}
function cleanup(){clearTimer();stopSpeech();if(recorder&&recorder.state==='recording')recorder.stop();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}state.active=false}
function home(){cleanup();app.innerHTML=`<h1>Build your speaking confidence</h1><p class="muted">Three original GEPT Intermediate-style practice sets. Choose a test and a mode to begin.</p><section class="panel"><h2>Choose your test</h2><select id="setSel">${SETS.map((s,i)=>`<option value="${i}" ${state.set===i?'selected':''}>${s.name}</option>`).join('')}</select><h2>Choose your mode</h2><div class="grid"><button class="btn alt" onclick="start('practice')">📖 Practice Mode</button><button class="btn" onclick="start('mock')">⏱ Mock Test Mode</button></div><p class="muted">Practice: replay, retry, and optional scaffolding after your first answer. Mock test: timed progression and no question transcript during Part 2.</p><div class="notice">Part 2 currently uses American English browser text-to-speech as a prototype. Pre-generated MP3 files can replace it for consistent audio. Please allow microphone and audio access. Browser recording requires HTTPS or localhost on most devices.</div></section>`;$('#setSel').onchange=e=>state.set=+e.target.value}
function start(mode){cleanup();state.mode=mode;state.step=0;state.recorded=[];state.showHelp=false;render()}
function getStep(){return steps()[state.step]}
function timeFor(st){if(st.kind==='intro')return 15;if(st.kind==='read')return 120;if(st.kind==='question')return SETS[state.set].questions[st.i].seconds;return 90}
function render(){clearTimer();const all=steps(),st=all[state.step];if(!st){finish();return}state.phase='idle';state.remaining=timeFor(st);state.showHelp=false;const mock=state.mode==='mock';let content='';if(st.kind==='intro')content=`<h2>Self-introduction</h2><p class="question">My seat number is ________, and my registration number is ________.</p><p class="muted">Practice only. Do not enter real personal identification numbers.</p>`;
if(st.kind==='read'){let p=SETS[state.set].passages[st.i];content=`<h2>${escapeHTML(p.title)}</h2><p class="reading">${escapeHTML(p.text)}</p><div class="tip">Preparation: 60 seconds. Read silently, then read aloud for up to 120 seconds. This prototype applies the timing to each passage independently.</div>`}
if(st.kind==='question')content=`<div class="audioBox"><div class="audioIcon">🎧</div><h2>Listen to the question</h2><p class="muted">The question is spoken twice. No text is shown before answering.</p><div id="audioStatus">Ready to play</div></div>`;
if(st.kind==='scene')content=`<h2>Describe the picture</h2>${sceneSVG(state.set)}<ol class="promptList">${SETS[state.set].prompts.map(q=>`<li>${escapeHTML(q)}</li>`).join('')}</ol><div class="tip">Preparation: 30 seconds. Answer for up to 90 seconds.</div>`;
app.innerHTML=`<section class="panel"><div class="head"><div><span class="pill">${SETS[state.set].name}</span><span class="pill">${mock?'Mock Test':'Practice'}</span></div><button class="btn alt" onclick="home()">Exit</button></div><div class="progress"><div style="width:${state.step/all.length*100}%"></div></div><p class="sub">${escapeHTML(st.label)} · ${state.step+1} of ${all.length}</p>${content}<div id="controls"><div class="timer" id="timer">${format(state.remaining)}</div><p class="muted" id="status" style="text-align:center">Ready</p><div class="actions" style="justify-content:center"><button class="btn" id="begin" onclick="begin()">${st.kind==='question'?'Play question twice':st.kind==='read'||st.kind==='scene'?'Start preparation':'Start recording'}</button>${!mock?'<button class="btn alt" onclick="next()">Skip</button>':''}</div></div><div id="result"></div></section>`}
function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function status(t){if($('#status'))$('#status').textContent=t}function updateTimer(){if($('#timer'))$('#timer').textContent=format(state.remaining)}
function count(seconds,done){clearTimer();state.remaining=seconds;updateTimer();interval=setInterval(()=>{state.remaining--;updateTimer();if(state.remaining<=0){clearTimer();done()}},1000)}
async function begin(){let st=getStep();$('#begin').disabled=true;if(st.kind==='question'){await ask(st);return}if(st.kind==='read'||st.kind==='scene'){status('Preparation time');count(st.kind==='read'?60:30,()=>beginRecording());return}beginRecording()}
function sayOnce(text,run){return new Promise(resolve=>{if(run!==token)return resolve();if(!('speechSynthesis'in window))return resolve();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.startsWith('en'))||null;let ended=false;let safety=setTimeout(()=>{if(!ended){ended=true;resolve()}},Math.max(9000,text.length*170));u.onend=u.onerror=()=>{if(!ended){ended=true;clearTimeout(safety);resolve()}};speechSynthesis.speak(u)})}

async function beginRecording(){state.phase='recording';status('Recording your answer');try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];let preferred=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});recordURL=URL.createObjectURL(blob);state.recorded.push({step:state.step,url:recordURL,blob});showResult();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};recorder.start();$('#begin').textContent='Stop recording';$('#begin').disabled=state.mode==='mock';$('#begin').onclick=stopRecording;count(timeFor(getStep()),stopRecording)}catch(e){status('Microphone unavailable: '+e.message);$('#begin').disabled=false;$('#begin').textContent='Try again';$('#begin').onclick=begin}}
function stopRecording(){clearTimer();if(recorder&&recorder.state==='recording')recorder.stop();state.phase='done';status('Answer complete');$('#begin').disabled=true}
function showResult(){let st=getStep(),mock=state.mode==='mock';if(!$('#result'))return;let last=state.recorded[state.recorded.length-1],ext=last.blob.type.includes('mp4')?'m4a':'webm';let result=`<hr style="border:0;border-top:1px solid #e3eaf0;margin-top:24px"><h2>Answer recorded</h2><audio controls src="${last.url}"></audio><div class="actions"><a class="btn alt" href="${last.url}" download="${SETS[state.set].name.replaceAll(' ','_')}_step_${state.step+1}.${ext}">Download recording</a>`;

function retry(){clearTimer();state.recorded=state.recorded.filter(x=>x.step!==state.step);render()}
